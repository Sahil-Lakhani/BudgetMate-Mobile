name: budgetmate
description: "BudgetMate: track expenses, scan receipts and split bills."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  cloud_firestore: ^6.10.0
  connectivity_plus: ^7.3.2
  firebase_app_check: ^0.4.8
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  google_fonts: ^9.0.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  image: ^4.10.1
  image_picker: ^1.2.3
  intl: ^0.20.3
  liquid_glass_renderer: 0.2.0-dev.4
  lucide_icons_flutter: ^3.1.21
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
  shaders:
    - shaders/dots.frag

# App icon (source art in assets/logo). Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo/icon-512.png
  min_sdk_android: 21
  adaptive_icon_background: "#18181B"
  adaptive_icon_foreground: assets/logo/icon-512.png
  adaptive_icon_foreground_inset: 0
